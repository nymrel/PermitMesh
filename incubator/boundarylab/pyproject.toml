[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nymrel-boundarylab"
version = "0.1.0"
description = "A provider-neutral conformance and evidence harness for authorized agent sandboxes."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nymrel", email = "contact@nymrel.com" }]
keywords = ["ai-agents", "sandbox", "conformance", "security", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
vercel = ["vercel-sandbox>=0.4,<1"]
test = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "mypy>=1.19,<3",
  "ruff>=0.14,<1",
]

[project.scripts]
boundarylab = "boundarylab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S404", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["boundarylab"]
