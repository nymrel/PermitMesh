name: BoundaryLab bootstrap

on:
  push:
    branches:
      - codex/boundarylab-incubator-20260818
    paths:
      - ".boundarylab-bootstrap/**"
      - ".github/workflows/boundarylab-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: boundarylab-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  expand:
    name: Verify and expand staged BoundaryLab source
    if: github.repository == 'nymrel/PermitMesh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/boundarylab-incubator-20260818
          fetch-depth: 0

      - name: Verify archive and materialize approved paths
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f .boundarylab-bootstrap/part-00 ]]; then
            echo "BoundaryLab source is already expanded."
            exit 0
          fi

          test "$(find .boundarylab-bootstrap -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 8
          cat .boundarylab-bootstrap/part-{00..07} > /tmp/boundarylab.b64
          base64 --decode /tmp/boundarylab.b64 > /tmp/boundarylab.tar.gz
          echo "263ae5e0ba455dc3d62b2fddb85bc34f3dd57bd9e7f9b4db40bde73fdcab24e0  /tmp/boundarylab.tar.gz" | sha256sum --check --strict -

          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile

          allowed_workflow = ".github/workflows/boundarylab-incubator.yml"
          allowed_prefix = "incubator/boundarylab/"

          with tarfile.open("/tmp/boundarylab.tar.gz", "r:gz") as archive:
              members = archive.getmembers()
              if len(members) != 61:
                  raise SystemExit(f"expected 61 files, found {len(members)}")

              for member in members:
                  parts = tuple(part for part in PurePosixPath(member.name).parts if part != ".")
                  if not parts or ".." in parts or member.name.startswith("/"):
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  path = "/".join(parts)
                  if not (path == allowed_workflow or path.startswith(allowed_prefix)):
                      raise SystemExit(f"unexpected archive path: {path}")
                  if not member.isfile():
                      raise SystemExit(f"non-regular archive member: {path}")

                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f"missing archive content: {path}")
                  target = Path(*parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read())
          PY

          rm -rf .boundarylab-bootstrap

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check

          unexpected="$(git diff --cached --name-only | grep -Ev '^(\.boundarylab-bootstrap/|\.github/workflows/boundarylab-incubator\.yml$|incubator/boundarylab/)' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected staged paths:"
            echo "$unexpected"
            exit 1
          fi

          test -f .github/workflows/boundarylab-incubator.yml
          test -f incubator/boundarylab/pyproject.toml
          test -f incubator/boundarylab/src/boundarylab/cli.py
          test -f incubator/boundarylab/tests/test_security_invariants.py

          git commit -m "feat(incubator): add BoundaryLab sandbox conformance MVP"
          git push origin HEAD:codex/boundarylab-incubator-20260818
