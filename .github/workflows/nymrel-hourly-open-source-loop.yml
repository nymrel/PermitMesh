name: Nymrel hourly open-source loop

on:
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  maintain:
    name: Propose guarded maintenance
    uses: nymrel/PermitMesh/.github/workflows/nymrel-hourly-worker.yml@12a7f453eae91d116ad68417cceaa82f22a79e89
    with:
      canary_mode: false
      guard_ref: 12a7f453eae91d116ad68417cceaa82f22a79e89
    permissions:
      actions: read
      contents: write
      pull-requests: write
      copilot-requests: write
      statuses: write
