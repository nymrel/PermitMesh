name: Nymrel GitHub Actions admission canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admit:
    name: Verify runner admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Emit admission proof
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'NYMREL_ACTIONS_ADMISSION_OK'
