name: Nymrel hourly open-source loop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/nymrel-hourly-open-source-loop.yml
  issues:
    types:
      - opened

jobs:
  maintain:
    name: Run activation canary
    if: >-
      github.event_name != 'issues' ||
      (github.actor == 'JalenBuildsHub' &&
       github.event.issue.title == '[control] Nymrel hourly loop activation canary')
    uses: nymrel/PermitMesh/.github/workflows/nymrel-hourly-worker.yml@9bea36f40978a13e46952b1e31da97d1b6fd20a9
    with:
      canary_mode: true
      guard_ref: 9bea36f40978a13e46952b1e31da97d1b6fd20a9
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: write
      statuses: write
      copilot-requests: write
