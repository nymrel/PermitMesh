name: Nymrel hourly open-source loop

on:
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  maintain:
    name: Propose guarded maintenance
    uses: nymrel/PermitMesh/.github/workflows/nymrel-hourly-worker.yml@27a996c03a63a487d0f282513ba2f9f57bbaba16
    with:
      canary_mode: false
      guard_ref: 27a996c03a63a487d0f282513ba2f9f57bbaba16
    permissions:
      actions: read
      contents: write
      pull-requests: write
      copilot-requests: write
      statuses: write
