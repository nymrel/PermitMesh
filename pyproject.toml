[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "permitmesh"
version = "0.2.0"
description = "Deterministic, fail-closed capability contracts for AI agents changing software."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nymrel" }]
maintainers = [{ name = "Nymrel" }]
keywords = ["ai-agents", "authorization", "capabilities", "policy", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
test = [
  "jsonschema[format]==4.26.0",
  "pytest==9.1.1",
]
dev = [
  "bandit==1.9.4",
  "build==1.6.0",
  "coverage==7.16.0",
  "jsonschema[format]==4.26.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.16.5",
  "twine==7.0.0",
]

[project.scripts]
permitmesh = "permitmesh.cli:main"

[project.urls]
Homepage = "https://github.com/nymrel/PermitMesh"
Issues = "https://github.com/nymrel/PermitMesh/issues"
Source = "https://github.com/nymrel/PermitMesh"

[tool.hatch.build]
exclude = [
  "/.agent",
  "/.benchmarks",
  "/.github",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/build",
  "/dist",
  "/reports",
  "/reviews",
  "/validation",
]

[tool.hatch.build.targets.wheel]
packages = ["src/permitmesh"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts", ".github/nymrel-hourly"]
strict = true
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["permitmesh"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests"]
severity = "medium"
confidence = "medium"
